<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memedash 🪙</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
:root{
  --bg:#0a0b0f; --bg2:#101218; --bg3:#161923; --border:#232734; --border2:#2e3342;
  --text:#e6e8ee; --muted:#8b90a0; --dim:#5c6070;
  --accent:#7c6cff; --green:#3fdd8f; --red:#ff5c6c; --amber:#ffb547;
  --font:'Inter',-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13.5px;line-height:1.5}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

.layout{display:flex;min-height:100vh}
.sidebar{width:200px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);
  padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{font-weight:700;font-size:15px;padding:6px 10px 18px;letter-spacing:.3px}
.logo span{color:var(--accent)}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;
  color:var(--muted);font-weight:500;margin-bottom:2px}
.nav a:hover{background:var(--bg3);color:var(--text)}
.nav a.active{background:var(--bg3);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.nav .key{margin-left:auto;font-size:10px;color:var(--dim);border:1px solid var(--border);
  border-radius:4px;padding:0 4px}
.health{margin-top:auto;padding:8px 10px;font-size:11px;color:var(--dim)}
.health .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}

.main{flex:1;min-width:0;padding:20px 26px 60px}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.topbar h1{font-size:17px;font-weight:600;margin-right:auto}
select,input[type=text],input[type=number]{background:var(--bg3);border:1px solid var(--border);
  color:var(--text);border-radius:7px;padding:6px 10px;font-family:inherit;font-size:12.5px;outline:none}
select:focus,input:focus{border-color:var(--accent)}
input[type=text]{width:220px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.card .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.card .v{font-size:21px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.card .v small{font-size:12px;color:var(--muted);font-weight:400}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.sidebar{display:none}}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px}
.panel h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.chart{height:240px}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;text-align:left;
  padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--text)}
th.sorted{color:var(--accent)}
td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:220px}
tr:hover td{background:var(--bg3)}
tr.click{cursor:pointer}
.num{text-align:right}
th.num{text-align:right}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--amber)}
.mono{font-family:var(--mono);font-size:12px}
.badge{display:inline-block;background:var(--bg3);border:1px solid var(--border);border-radius:5px;
  padding:1px 7px;font-size:11px;color:var(--muted)}
.badge.sol{color:#9d7cff;border-color:#3a2f5e}.badge.eth{color:#7cb6ff;border-color:#2b3e5e}
.badge.base{color:#5c8aff;border-color:#243a6e}.badge.bnb{color:#ffd45c;border-color:#5e4f1e}
.badge.rh{color:#5cffb8;border-color:#1e5e43}
.mult{font-weight:600}
.pager{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--muted);font-size:12px}
.pager button{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;
  padding:5px 12px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.empty{color:var(--dim);padding:30px;text-align:center}
.crumb{color:var(--muted);font-size:12px;margin-bottom:4px}
.crumb a{color:var(--accent)}
.links a{margin-right:10px;color:var(--accent);font-size:12px}
.loading{color:var(--dim);padding:40px;text-align:center}

#live{position:fixed;z-index:50;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;
  box-shadow:0 8px 30px rgba(0,0,0,.55);display:flex;flex-direction:column;
  resize:both;overflow:hidden;min-width:240px;min-height:36px}
#live-head{display:flex;align-items:center;gap:7px;padding:7px 10px;cursor:grab;user-select:none;
  border-bottom:1px solid var(--border);font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--muted);touch-action:none}
#live-head .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.25}}
#live-body{flex:1;overflow-y:auto;padding:3px 0}
.live-row{display:flex;gap:7px;align-items:baseline;padding:4px 10px;font-size:12px;white-space:nowrap;overflow:hidden}
.live-row .t{color:var(--dim);font-size:11px;flex-shrink:0;min-width:34px}
.live-row .who{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.live-row.new{animation:flash 2.5s}
@keyframes flash{0%{background:rgba(124,108,255,.3)}100%{background:transparent}}
#live-collapse{cursor:pointer;background:none;border:none;color:var(--muted);font-size:13px;padding:0 2px}
#live-collapse:hover{color:var(--text)}
#live-mute{margin-left:auto;cursor:pointer;background:none;border:none;font-size:12px;padding:0 2px;filter:grayscale(30%)}
#live-mute:hover{filter:none}

.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab,.ctab{background:var(--bg3);border:1px solid var(--border);color:var(--muted);border-radius:7px;
  padding:5px 14px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500}
.tab:hover,.ctab:hover{color:var(--text)}
.tab.active,.ctab.active{color:var(--text);border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.jbtn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);border-radius:5px;
  padding:1px 8px;cursor:pointer;font-size:13px}
.jbtn:hover{color:var(--text);border-color:var(--accent)}
.pfp{width:20px;height:20px;border-radius:50%;vertical-align:-5px;margin-right:6px;background:var(--bg3)}
.vresize{resize:vertical;overflow:auto;min-height:120px}
.vresize thead th{position:sticky;top:0;background:var(--bg2);z-index:2}
.mrow{padding:5px 2px;border-bottom:1px solid var(--border);font-size:12px}
.mrow .t{color:var(--dim);font-size:11px;margin-right:4px}
.mtxt{color:var(--muted);white-space:pre-wrap;word-break:break-word;font-size:11.5px;margin-top:1px}
.socials{margin-top:6px;font-size:11.5px}
.socials a{color:var(--accent)}
#mc-refresh{background:none;border:1px solid var(--border);color:var(--muted);border-radius:5px;
  cursor:pointer;font-size:12px;padding:0 6px;margin-left:6px;vertical-align:1px}
#mc-refresh:hover{color:var(--text);border-color:var(--accent)}
.hide-btn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:11px;padding:0 4px;
  margin-left:2px;border-radius:4px;vertical-align:1px}
.hide-btn:hover{color:var(--red);background:var(--bg3)}
.showall-btn{cursor:pointer;color:var(--accent)}
.showall-btn:hover{text-decoration:underline}

/* ---------------- Wallet Groups ---------------- */
.wg-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.wg-primary{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:7px;
  padding:6px 14px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600}
.wg-primary:hover{filter:brightness(1.12)}
.wg-primary:disabled{opacity:.5;cursor:default}
.wg-ghost{background:var(--bg3);border:1px solid var(--border);color:var(--muted);border-radius:7px;
  padding:6px 12px;cursor:pointer;font-family:inherit;font-size:12.5px}
.wg-ghost:hover{color:var(--text);border-color:var(--border2)}
.wg-ghost.danger{color:var(--red);border-color:var(--red)}
.wg-live{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--dim);font-size:11.5px}
.wg-live .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.wg-live.busy .dot{background:var(--amber)}
.wg-summary{font-size:14px;color:var(--muted)}
.wg-summary b{color:var(--text);font-weight:650}
.wg-summary .sep,.wg-foot .sep{color:var(--dim);margin:0 3px}
.wg-summary .muted,.wg-none .muted{color:var(--dim)}
.wg-notes{color:var(--dim);font-size:11.5px;margin-top:5px}
.wg-notes .warn{color:var(--amber)}
.wg-controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:14px 0 16px;
  padding-bottom:14px;border-bottom:1px solid var(--border)}
.wg-lab{color:var(--muted);font-size:12px;display:flex;gap:7px;align-items:center}
.wg-pills{display:flex;gap:4px}
.wg-pills button{background:var(--bg3);border:1px solid var(--border);color:var(--muted);border-radius:6px;
  padding:4px 11px;cursor:pointer;font-family:inherit;font-size:12px}
.wg-pills button:hover{color:var(--text)}
.wg-pills button.on{color:var(--text);border-color:var(--accent);background:rgba(124,108,255,.14)}

.wg-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px;align-items:start}
@media(max-width:980px){.wg-cards{grid-template-columns:1fr}}
.wg-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;
  position:relative;overflow:hidden;isolation:isolate;
  transition:opacity .4s ease,transform .4s ease,border-color .3s,box-shadow .3s}
.wg-card:hover{border-color:var(--border2)}
/* the token's own banner behind the card. Two layers: the art, and a scrim that
   fades it into the card background so text stays readable over any artwork. */
.wg-card.has-art::before{content:"";position:absolute;inset:0;z-index:-2;
  background-image:var(--wg-art);background-size:cover;background-position:center top;
  opacity:.30;transition:opacity .3s}
/* a profile picture is square, so it tiles badly stretched — blur it into a wash */
.wg-card.art-logo::before{background-size:130% auto;filter:blur(22px) saturate(1.4);opacity:.34}
.wg-card.has-art::after{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(14,16,22,.34) 0%,rgba(14,16,22,.80) 42%,var(--bg2) 88%)}
.wg-card.has-art:hover::before{opacity:.42}

/* dismiss — sits in the corner gutter the header leaves for it */
.wg-dismiss{position:absolute;top:7px;right:7px;z-index:2;width:22px;height:22px;line-height:1;
  border:1px solid transparent;border-radius:6px;background:rgba(10,12,18,.5);color:var(--dim);
  cursor:pointer;font-family:inherit;font-size:11px;opacity:0;transition:opacity .18s,color .18s,border-color .18s}
.wg-card:hover .wg-dismiss,.wg-dismiss:focus-visible{opacity:1}
.wg-dismiss:hover{color:var(--red);border-color:var(--red);background:rgba(10,12,18,.85)}
@media(hover:none){.wg-dismiss{opacity:.75}}

/* a card on its way out: desaturated, quieter, and clearly not a live signal */
.wg-card.wg-cooling{opacity:.72;border-color:var(--border);background:var(--bg2)}
.wg-card.wg-cooling:hover{opacity:.92}
.wg-card.wg-cooling.has-art::before{opacity:.10;filter:grayscale(.85)}
.wg-card.wg-cooling .wg-count b{color:var(--muted)}
.wg-cool{background:rgba(255,176,64,.12);border:1px solid rgba(255,176,64,.45);color:var(--amber);
  border-radius:5px;padding:0 6px;font-size:9.5px;font-weight:700;letter-spacing:.6px}
.wg-cool-n{color:var(--amber)}
.wg-cool-note{margin-top:10px;color:var(--amber);font-size:11.5px;line-height:1.5}
.wg-exits{margin-top:9px;display:flex;flex-direction:column;gap:4px}
.wg-exit{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--text);
  background:rgba(255,90,110,.08);border-left:2px solid var(--red);border-radius:0 6px 6px 0;
  padding:5px 8px}
.wg-exit-mark{color:var(--red);font-weight:700}
.wg-exit-when{margin-left:auto;color:var(--dim);font-size:10.5px;white-space:nowrap}
.wg-still{margin:10px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.wg-still b{color:var(--text)}

.wg-bell{padding:5px 8px;line-height:1}
.wg-bell.off{opacity:.5}
.wg-hidden-chip{color:var(--muted)}
.wg-note{color:var(--muted);font-size:12px;line-height:1.6;margin:-6px 0 14px}
.wg-panel.wg-wide{width:min(920px,100%)}
.wg-dnote{color:var(--muted);font-size:11.5px;margin-bottom:10px;line-height:1.5}
.wg-dnote.warn{color:var(--amber)}
.wg-dtbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.wg-dtbl th{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;
  text-align:left;padding:5px 6px;border-bottom:1px solid var(--border);white-space:nowrap}
.wg-dtbl th.num,.wg-dtbl td.num{text-align:right}
.wg-dtbl td{padding:7px 6px;border-bottom:1px solid rgba(35,39,52,.55);vertical-align:middle}
.wg-dtbl tr:last-child td{border-bottom:none}
.wg-dtbl tr:hover td{background:var(--bg3)}
.wg-dtbl .accent{color:var(--accent);font-size:14px}
.wg-dtok{display:flex;flex-wrap:wrap;gap:4px;max-width:340px}
.wg-dtag{background:var(--bg3);border:1px solid var(--border);border-radius:5px;
  padding:1px 6px;font-size:10.5px;color:var(--muted);white-space:nowrap}
/* an early buyer is the evidence that separates an edge from a follower */
.wg-dtag.early{border-color:rgba(63,221,143,.55);color:var(--green);background:rgba(63,221,143,.10)}
.wg-add-cand{padding:3px 12px}
.wg-hrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.wg-hrow:last-child{border-bottom:none}
.wg-hlogo{width:28px;height:28px;border-radius:7px;background:var(--bg3);object-fit:cover;flex-shrink:0}
.wg-hid{display:flex;flex-direction:column;min-width:0}
.wg-hid .mono{color:var(--dim);font-size:10.5px}
.wg-hmeta{margin-left:auto;color:var(--muted);font-size:11.5px;white-space:nowrap}
/* a token that just crossed two wallets arrives like an alert, not a table row */
@keyframes wgIn{0%{opacity:0;transform:translateY(16px) scale(.965)}60%{opacity:1}100%{opacity:1;transform:none}}
.wg-card.wg-in{animation:wgIn .5s cubic-bezier(.2,.8,.25,1);border-color:var(--accent);
  box-shadow:0 0 0 1px rgba(124,108,255,.35),0 10px 34px rgba(124,108,255,.16)}
.wg-card.wg-out{opacity:0;transform:scale(.96) translateY(-8px);pointer-events:none}
@keyframes wgTick{0%{box-shadow:0 0 0 1px rgba(124,108,255,.45)}100%{box-shadow:0 0 0 1px transparent}}
.wg-card.wg-tick{animation:wgTick .9s}

.wg-head{display:flex;gap:11px;align-items:flex-start;padding-right:20px}
.wg-logo{width:40px;height:40px;border-radius:10px;flex-shrink:0;background:var(--bg3);object-fit:cover}
.wg-logo-x{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;font-weight:700}
.wg-id{min-width:0;flex:1}
.wg-title{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.wg-title a{font-size:16px;font-weight:700}
.wg-title a:hover{color:var(--accent)}
.wg-sub{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.wg-new{background:rgba(63,221,143,.14);border:1px solid rgba(63,221,143,.5);color:var(--green);
  border-radius:5px;padding:0 6px;font-size:9.5px;font-weight:700;letter-spacing:.6px;animation:pulse 1.6s infinite}
.wg-ca{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--dim);font-size:11.5px}
.wg-copy,.wg-info{background:none;border:none;color:var(--dim);cursor:pointer;font-size:11.5px;padding:0 2px}
.wg-copy:hover,.wg-info:hover{color:var(--accent)}
.wg-count{margin-left:auto;text-align:right;flex-shrink:0;line-height:1.1}
.wg-count b{font-size:26px;font-weight:750;color:var(--accent);font-variant-numeric:tabular-nums}
.wg-count span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

.wg-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 10px;padding:9px 0;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.wg-stats .k{display:block;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.wg-stats .v{display:block;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.wg-stats .v small{font-size:10.5px;font-weight:500;opacity:.8}
.wg-stats .accent{color:var(--accent)}
@media(max-width:620px){.wg-stats{grid-template-columns:repeat(2,1fr)}}

.wg-tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12.5px}
.wg-tbl th{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;text-align:left;
  padding:4px 6px;border-bottom:1px solid var(--border);cursor:default;white-space:nowrap}
.wg-tbl th:hover{color:var(--muted)}
.wg-tbl th.num,.wg-tbl td.num{text-align:right}
.wg-tbl td{padding:6px;border-bottom:1px solid rgba(35,39,52,.55);white-space:nowrap;max-width:none}
.wg-tbl tr:last-child td{border-bottom:none}
.wg-tbl tr:hover td{background:var(--bg3)}
.wg-tbl td small{font-size:10.5px;opacity:.75;margin-left:3px}
.wg-wname{font-weight:600}
.wg-waddr{color:var(--dim);font-size:10.5px;margin-left:6px}
.wg-mark{color:var(--dim);font-size:10px;margin-left:3px}
.wg-unknown{color:var(--dim);cursor:help;border-bottom:1px dotted var(--border2)}
@keyframes wgRowIn{from{background:rgba(124,108,255,.22)}to{background:transparent}}
.wg-tbl tr.wg-row-in td{animation:wgRowIn 2.2s}

.wg-foot{margin-top:10px;padding-top:9px;border-top:1px solid var(--border);color:var(--muted);
  font-size:11.5px;display:flex;gap:3px;align-items:baseline;flex-wrap:wrap}
.wg-foot b{color:var(--text)}
.wg-caveat{color:var(--amber);cursor:help}
.wg-when{margin-left:auto;color:var(--dim);white-space:nowrap}

.wg-empty{text-align:center;padding:46px 26px;max-width:580px;margin:36px auto}
.wg-empty-mark{font-size:34px;color:var(--accent);opacity:.75}
.wg-empty h2{font-size:17px;margin:10px 0 8px}
.wg-empty p{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:18px}
.wg-none{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px;
  border:1px dashed var(--border);border-radius:12px}

.wg-modal{position:fixed;inset:0;z-index:100;background:rgba(6,7,10,.72);display:flex;
  align-items:center;justify-content:center;padding:20px;animation:wgFade .18s}
@keyframes wgFade{from{opacity:0}to{opacity:1}}
.wg-panel{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:18px;
  width:min(640px,100%);max-height:86vh;overflow:auto;box-shadow:0 18px 60px rgba(0,0,0,.6)}
.wg-panel h3{font-size:15px;margin-bottom:14px}
.wg-field{display:block;margin-bottom:12px}
.wg-field span{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.wg-field input,.wg-row input{width:100%}
.wg-row{display:flex;gap:7px;margin-bottom:7px}
.wg-row .wg-a{flex:2;min-width:0}
.wg-row .wg-l{flex:1;min-width:0}
.wg-x{background:var(--bg3);border:1px solid var(--border);color:var(--dim);border-radius:6px;
  width:32px;flex-shrink:0;cursor:pointer}
.wg-x:hover{color:var(--red);border-color:var(--red)}
